name: Zero-Trust IaC Governance

on:
  push:
    branches: ['**']
    paths:
      - '**/*.tf'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'
      - '.github/workflows/zero-trust-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zt-lint-scan:
    name: Zero-Trust Spec Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install zt-lint
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/CorrieK/zt-lint.git"

      - name: Run Zero-Trust Scan & Generate Audit Report
        id: scan
        run: |
          set +e
          zt-lint scan . --format markdown --output zt-audit-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish audit report to job summary
        if: always() && hashFiles('zt-audit-report.md') != ''
        run: cat zt-audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        if: always() && hashFiles('zt-audit-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zt-audit-report
          path: zt-audit-report.md

      # zt-lint exits 0 when there are no CRITICAL/HIGH findings and 1 when
      # there is at least one. Any other code means the tool itself failed.
      - name: Enforce Zero-Trust Gate
        if: always()
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          case "$EXIT_CODE" in
            0) echo "No CRITICAL or HIGH findings." ;;
            1) echo "::error::CRITICAL or HIGH Zero-Trust findings detected. See the job summary or the zt-audit-report artifact."; exit 1 ;;
            *) echo "::error::zt-lint failed to run (exit code '${EXIT_CODE:-none}'). Treating as a failed gate."; exit 1 ;;
          esac
