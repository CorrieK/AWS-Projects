AWSTemplateFormatVersion: '2010-09-09'
Description: >
  INTENTIONALLY INSECURE test fixture for zt-lint. DO NOT DEPLOY.
  Region: eu-west-1 (Ireland). Credentials below are AWS documentation dummies.

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id

Resources:
  # VIOLATION: wildcard action on wildcard resource
  WildcardRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zt-fixture-wildcard-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: god-mode
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: '*'
                Resource: '*'
              - Effect: Allow
                Action: 's3:*'
                Resource: '*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WildcardRole

  # VIOLATION: SSH, RDP and all ports open to the world; unrestricted egress
  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Overly permissive SG (test fixture)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
        - IpProtocol: -1
          CidrIpv6: '::/0'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  TestInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !Ref OpenSecurityGroup
      # VIOLATION: IMDSv1 allowed
      MetadataOptions:
        HttpTokens: optional
        HttpEndpoint: enabled
      # VIOLATION: unencrypted root volume
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            Encrypted: false
      # VIOLATION: hardcoded access key (AWS documentation dummy values)
      UserData:
        Fn::Base64: |
          #!/bin/bash
          export AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
          export AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          export AWS_DEFAULT_REGION=eu-west-1
      Tags:
        - Key: Name
          Value: zt-fixture-insecure

Outputs:
  InstanceId:
    Value: !Ref TestInstance
